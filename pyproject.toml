[project]
name = "streaming-pipeline"
version = "0.1.0"
description = "Kafka-based streaming pipeline: public weather data -> Kafka -> hourly aggregation -> Postgres, with Prometheus/Grafana/Alertmanager observability"
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka>=2.4.0,<3.0.0",
    "psycopg2-binary>=2.9.9,<3.0.0",
    "requests>=2.31.0,<3.0.0",
    "prometheus-client>=0.20.0,<0.21.0",
    "pydantic>=2.7.0,<3.0.0",
    "flask>=3.0.3,<4.0.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "tenacity>=8.3.0,<9.0.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

