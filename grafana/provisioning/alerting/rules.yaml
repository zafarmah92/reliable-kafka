apiVersion: 1

groups:
  - orgId: 1
    name: pipeline-alerts
    folder: Pipeline Alerts
    interval: 1m
    rules:
      - uid: producer-down
        title: Producer is down
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model: { expr: 'up{job="producer"}', instant: true, refId: A }
          - refId: C
            datasourceUid: "__expr__"
            relativeTimeRange: { from: 300, to: 0 }
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: C
        noDataState: Alerting
        execErrState: Alerting
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "Prometheus cannot scrape the Producer - it is likely down or crash-looping."

      - uid: consumer-down
        title: Consumer is down
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model: { expr: 'up{job="consumer"}', instant: true, refId: A }
          - refId: C
            datasourceUid: "__expr__"
            relativeTimeRange: { from: 300, to: 0 }
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: C
        noDataState: Alerting
        execErrState: Alerting
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "Prometheus cannot scrape the Consumer - it is likely down or crash-looping."

      - uid: opensky-produce-failures
        title: Producer delivery failures detected
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model: { expr: 'increase(messages_produce_failed_total{job="producer"}[5m])', instant: true, refId: A }
          - refId: C
            datasourceUid: "__expr__"
            relativeTimeRange: { from: 300, to: 0 }
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: C
        noDataState: OK
        execErrState: Alerting
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "One or more OpenSky messages failed to be delivered by the producer in the last 5 minutes."

      - uid: consumer-errors
        title: Consumer errors detected
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 300, to: 0 }
            model: { expr: 'increase(consumer_errors_total{job="consumer"}[5m])', instant: true, refId: A }
          - refId: C
            datasourceUid: "__expr__"
            relativeTimeRange: { from: 300, to: 0 }
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }
              refId: C
        noDataState: OK
        execErrState: Alerting
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "The Consumer reported one or more poll/processing errors in the last 5 minutes."
